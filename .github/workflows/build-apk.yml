name: Build DRIVETONE APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: | 
          SDK_MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify sources
        run: python3 scripts/verify_sources.py
      - name: Validate V8 JavaScript syntax and feature wiring
        run: |
          node --check app/src/main/assets/v8.js
          node --check app/src/main/assets/v7.js
          node --check app/src/main/assets/v6.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/assets")
          index=(root/"index.html").read_text()
          assert '<script src="v8.js"></script>' in index
          code=(root/"v8.js").read_text()
          for token in ("v8-native-enable","v8-mic-start","v8-pad","v8-voice","v8-diagnostics","applyNativeEQ","voiceResult"):
              assert token in code, token
          print("V8 source wiring verified.")
          PY
      - name: Assemble APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -3
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -10
      - uses: actions/upload-artifact@v4
        with:
          name: DRIVETONE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish directly downloadable Android APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DRIVETONE-V9.apk
          if gh release view "v9.0.0-debug" >/dev/null 2>&1; then
            gh release upload "v9.0.0-debug" DRIVETONE-V9.apk --clobber
          else
            gh release create "v9.0.0-debug" DRIVETONE-V9.apk --target "${GITHUB_SHA}" --title "DRIVETONE V9 — Android APK" --notes "Android telefonlara kurulabilir debug APK. Kaynak: GitHub Actions tarafından üretilmiştir. Test cihazında doğrulama gerektirir; FOR-X fiziksel DSP kontrolü henüz mevcut değildir." --prerelease
          fi
