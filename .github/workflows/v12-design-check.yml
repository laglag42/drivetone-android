name: V12 design checks (NO APK)
on:
  push:
    branches: ["design/v12-blue-cockpit"]
  pull_request:
    branches: [main]
jobs:
  design:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test V12 HTML, JS and SVG assets
        run: python3 scripts/verify_v12_design.py
      - name: Setup headless mobile browser
        run: |
          python3 -m venv /tmp/drivetone-browser
          /tmp/drivetone-browser/bin/pip install playwright==1.56.0
          /tmp/drivetone-browser/bin/python -m playwright install chromium
      - name: Exercise UI on real Chromium mobile viewports
        run: /tmp/drivetone-browser/bin/python scripts/test_v12_browser.py
      - name: Upload UI screenshots and validation report (NOT APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRIVETONE-V12-Design-Validation
          path: v12-browser-results/
          if-no-files-found: ignore
      - name: Set up Java 17 for native Android compile check
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android compilation platform (no APK)
        run: |
          SDK_MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android Kotlin code only, do not package an APK
        run: gradle --no-daemon :app:compileDebugKotlin
      - name: Verify notification-listener safety is unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/AndroidManifest.xml").read_text()
          assert "BIND_NOTIFICATION_LISTENER_SERVICE" not in s
          print("Notification listener not reintroduced.")
          PY
